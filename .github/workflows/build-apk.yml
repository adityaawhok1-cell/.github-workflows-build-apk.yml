name: Build APK Menara Emblem

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan game dan kunci
        run: |
          mkdir -p www
          echo '' | base64 -d | gunzip > www/index.html
          echo '' | base64 -d > kunci.jks
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          echo '{"name":"menaraemblem","version":"1.0.0","private":true}' > package.json
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Menara Emblem" com.menaraemblem.game --web-dir=www
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/menaraemblem/game/MainActivity.java <<'EOF'
          package com.menaraemblem.game;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              setRequestedOrientation(android.content.pm.ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
              super.onCreate(b);
              if (Build.VERSION.SDK_INT >= 28) {
                getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              hide();
            }
            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hide();
            }
            private void hide() {
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }
          }
          EOF
          cp kunci.jks android/kunci.jks
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'
          android {
            signingConfigs {
              kunci {
                storeFile file('../kunci.jks')
                storePassword 'kontrol123'
                keyAlias 'kunci'
                keyPassword 'kontrol123'
              }
            }
            buildTypes {
              release { signingConfig signingConfigs.kunci }
            }
          }
          EOF
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MenaraEmblem-HD-Landscape-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
